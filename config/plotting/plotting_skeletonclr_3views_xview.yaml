work_dir: work_dir/plotting/1_xview_frame50_channel16_epoch300_cross150

weights: work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/c005_cosann/epoch300_model.pt
ignore_weights: [encoder_q.fc, encoder_q_motion.fc, encoder_q_bone.fc, encoder_k, encoder_k_motion, encoder_k_bone, queue, queue_motion, queue_bone]

# feeder
train_feeder: feeder.ntu_feeder.Feeder_single
train_feeder_args:
  data_path: xview/train_data.npy
  label_path: xview/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True

# model
model: net.skeletonclr_3views.SkeletonCLR_3views
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 32 #128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16 # 1/4 x channels of standard stgcn
  hidden_dim: 256
  num_class: 60
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True
  curvature: 1.0

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 1
start_epoch: 0

view: 'all'

# plotting
plot_methods: [tsne, hyp_tsne]
plot_selected_labels: [5, 11, 13, 14, 25, 27, 39, 42, 50, 54]
plot_color_by: [class_group, class]
plot_class_groups:
  object_interaction: [5, 11, 25, 27]
  dressing: [13, 14]
  gesture: [39]
  falling_posture: [42]
  interpersonal: [50, 54]
plot_class_names:
  5: "pickup"
  11: "writing"
  13: "wear jacket"
  14: "take off jacket"
  25: "hopping"
  27: "phone call"
  39: "cross hands"
  42: "falling"
  50: "kicking other person"
  54: "hugging other person"

# log
save_interval: 5
eval_interval: -1

work_dir: work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/3views_c005_cosann_hyp_pseudo_supcon

#weights: work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/unsupervised/epoch150_model.pt
#ignore_weights: [encoder_q.fc, encoder_q_motion.fc, encoder_q_bone.fc, encoder_k, encoder_k_motion, encoder_k_bone, queue, queue_motion, queue_bone]

# feeder
train_feeder: feeder.ntu_feeder.Feeder_dual
dataset_root: ''
train_feeder_args:
  data_path: xview/train_position.npy
  label_path: xview/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True

# model
model: net.skeletonclr_3views.SkeletonCLR_3views
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 32 #128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16 # 1/4 x channels of standard stgcn
  hidden_dim: 256
  num_class: 60
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True
  curvature: 1.0
  cluster_enabled: True
  num_clusters: 5
  sinkhorn_tau: 0.1
  sinkhorn_iters: 20
  sinkhorn_eps: 0.05

# optim
nesterov: True
weight_decay: 1e-4
base_lr: 0.01
optimizer: SGD
lr_scheduler: cosine
lr_warmup_epochs: 15
lr_warmup_start_factor: 0.001
lr_eta_min: 0.0
lr_t_max: 285

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0

view: 'all'

# contrastive training
contrastive_schedule:
  - mode: augmentation
    start_epoch: 1
    end_epoch: 150
  - mode: pseudo_hard
    start_epoch: 151
    end_epoch: 300
    transition_epochs: 10
    lambda_aug: 1.0
    lambda_pseudo: 0.2
temperature: 0.07
curvature: 1.0
lambda_sink: 1.0
lambda_hier: 0.2
hier_update_interval: 200
hier_warmup_steps: 1000
hier_triplets: 512
hier_margin: 0.05
affinity_momentum: 0.9
affinity_temperature: 1.0
pseudo_supcon_warmup_steps: 1000
pseudo_supcon_ramp_steps: 2000
pseudo_supcon_confidence_threshold: 0.8
pseudo_supcon_assignment_source: q_k

# live embedding diagnostics
embedding_plot_interval: 5
embedding_plot_max_samples: 1024
embedding_plot_methods: [logmap_pca_disk, hyp_tsne]
embedding_plot_selected_labels: [5, 11, 13, 14, 25, 27, 39, 42, 50, 54]
embedding_plot_color_by: [class_group, class]
embedding_plot_hierarchy: True
embedding_plot_hierarchy_linkages: [average_hyperbolic]
embedding_plot_hierarchy_log_max_merges: 20
embedding_plot_class_groups:
  object_interaction: [5, 11, 25, 27]
  dressing: [13, 14]
  gesture: [39]
  falling_posture: [42]
  interpersonal: [50, 54]
embedding_plot_class_names:
  5: "pick up"
  11: "writing"
  13: "put on jacket"
  14: "take off jacket"
  25: "hopping"
  27: "phone call"
  39: "cross hands in front"
  42: "falling down"
  50: "kicking"
  54: "hugging"

# log
save_interval: 5
eval_interval: -1

work_dir: work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/c005_cosann_no_clust

#weights: work_dir/skeletonclr/1_xview_frame50_channel16_epoch300_cross150/unsupervised/epoch150_model.pt
#ignore_weights: [encoder_q.fc, encoder_q_motion.fc, encoder_q_bone.fc, encoder_k, encoder_k_motion, encoder_k_bone, queue, queue_motion, queue_bone]

# feeder
train_feeder: feeder.ntu_feeder.Feeder_dual
dataset_root: ''
train_feeder_args:
  data_path: xview/train_data.npy
  label_path: xview/train_label.pkl
  shear_amplitude: 0.5
  temperal_padding_ratio: 6
  mmap: True

# model
model: net.skeletonclr.SkeletonCLR
model_args:
  base_encoder: net.st_gcn.Model
  pretrain: True
  feature_dim: 32 #128
  queue_size: 32768
  momentum: 0.999
  Temperature: 0.07
  mlp: True
  in_channels: 3
  hidden_channels: 16 # 1/4 x channels of standard stgcn
  hidden_dim: 256
  num_class: 60
  dropout: 0.5
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'spatial'
  edge_importance_weighting: True
  curvature: 1.0
  cluster_enabled: False
  num_clusters: 60
  sinkhorn_tau: 0.1
  sinkhorn_iters: 20
  sinkhorn_eps: 0.05

# optim
nesterov: True
weight_decay: 1e-4
base_lr: 0.1
optimizer: SGD
lr_scheduler: cosine
lr_warmup_epochs: 0
lr_warmup_start_factor: 0.001
lr_eta_min: null  # defaults to 0.01 * base_lr
lr_t_max: null  # defaults to min(50, num_epoch - lr_warmup_epochs)

# training
device: [0]
batch_size: 128
test_batch_size: 128
num_epoch: 300
start_epoch: 0

view: 'joint'

# supervised training
sup_epoch: 301
temperature: 0.07
curvature: 1.0
lambda_sink: 0.0
lambda_hier: 0.0
hier_update_interval: 200
hier_warmup_steps: 1000
hier_triplets: 512
hier_margin: 0.05
affinity_momentum: 0.9
affinity_temperature: 1.0

# log
save_interval: 5
eval_interval: -1
